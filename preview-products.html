<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashShp — Products Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lancelot&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=23" />
</head>
<body>

  <!-- ─── NAVIGATION ─── -->
  <nav class="nav">
    <div class="nav__inner">

      <a href="/" class="nav__logo">FlashShp</a>

      <ul class="nav__links">
        <li><a href="/" data-i18n="nav.home">Home</a></li>
        <li><a href="/products" class="active" data-i18n="nav.shop">Products</a></li>
        <li><a href="/tutorials" data-i18n="nav.tutorials">Tutorials</a></li>
        <li><a href="/review" data-i18n="nav.reviews">Reviews</a></li>
      </ul>

      <div class="nav__actions">

        <button class="nav__cart" id="cartBtn" aria-label="Cart" onclick="window._openCart && window._openCart()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span class="nav__cart-label">Cart</span>
          <span class="nav__cart-count" id="cartCount">0</span>
        </button>

        <button class="nav__login" aria-label="Sign In" onclick="location.href='/login'">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav__login-label" data-i18n="nav.login">Sign In</span>
        </button>
        <button class="btn-icon nav__hamburger" id="hamburger" aria-label="Menu">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

      </div>
    </div>
  </nav>

  <!-- ─── MOBILE DRAWER ─── -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer__header">
      <span class="drawer__logo">FlashShp</span>
      <button class="btn-icon" id="drawerClose" aria-label="Close">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <ul class="drawer__links">
      <li><a href="/" class="drawer-link" data-i18n="nav.home">Home</a></li>
      <li><a href="/products" class="drawer-link active" data-i18n="nav.shop">Shop</a></li>
      <li><a href="/tutorials" class="drawer-link" data-i18n="nav.tutorials">Tutorials</a></li>
      <li><a href="/review" class="drawer-link" data-i18n="nav.reviews">Reviews</a></li>
    </ul>
    <div style="margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:8px;">
      <button class="btn-primary btn-primary--lg" style="width:100%;border-radius:6px;" data-i18n="nav.login">Sign In</button>
      <button class="btn-ghost" style="width:100%;" data-i18n="nav.register">Create Account</button>
    </div>
  </div>

  <!-- ─── SHOP LAYOUT ─── -->
  <div class="shop-layout">

    <!-- ── MAIN ── -->
    <main class="shop-main">

      <!-- Barre de filtres : recherche + tri + pills de catégories (remplace l'ancienne sidebar) -->
      <div class="shop-filterbar">
        <div class="shop-filterbar__row">
          <div class="shop-filterbar__search">
            <svg class="shop-filterbar__search-icon" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input class="shop-filterbar__search-input" id="searchInput" type="text" placeholder="Search products…" autocomplete="off" />
            <button type="button" class="shop-filterbar__search-clear" id="searchClearBtn" aria-label="Clear search" style="display:none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <kbd class="shop-filterbar__search-kbd" id="searchKbdHint">⌘K</kbd>
          </div>
          <!-- Tri : dropdown custom (bouton + panel) pour un style entierement maitrise -->
          <div class="sort-filter" id="sortFilter">
            <input type="hidden" id="sortSelect" value="default" />
            <button type="button" class="sort-filter__btn" id="sortFilterBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
              <span id="sortFilterLabel">Recommended</span>
              <svg class="sort-filter__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="sort-filter__panel" id="sortPanel">
              <button type="button" class="sort-filter__option selected" data-value="default">Recommended</button>
              <button type="button" class="sort-filter__option" data-value="price-asc">Price: Low to High</button>
              <button type="button" class="sort-filter__option" data-value="price-desc">Price: High to Low</button>
              <button type="button" class="sort-filter__option" data-value="name">Name: A to Z</button>
            </div>
          </div>

          <!-- Filtre Prix : popover avec champs From/To + slider double-poignée -->
          <div class="price-filter" id="priceFilter">
            <button type="button" class="price-filter__btn" id="priceFilterBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15.5 9.5c0-1.66-1.57-3-3.5-3s-3.5 1.34-3.5 3 1.57 2.5 3.5 2.5 3.5 1.34 3.5 3-1.57 3-3.5 3-3.5-1.34-3.5-3"/></svg>
              Price
              <svg class="price-filter__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="price-filter__panel" id="pricePanel">
              <div class="price-filter__panel-header">
                <span class="price-filter__panel-title">Price</span>
                <button type="button" class="price-filter__panel-close" id="pricePanelClose" aria-label="Close">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="price-filter__fields">
                <div class="price-filter__field">
                  <label for="priceMin">From</label>
                  <div class="price-filter__field-input"><span>€</span><input type="number" id="priceMin" min="0" step="1" inputmode="decimal" /></div>
                </div>
                <div class="price-filter__field">
                  <label for="priceMax">To</label>
                  <div class="price-filter__field-input"><span>€</span><input type="number" id="priceMax" min="0" step="1" inputmode="decimal" /></div>
                </div>
              </div>
              <div class="price-slider">
                <div class="price-slider__track"></div>
                <div class="price-slider__range" id="priceSliderRange"></div>
                <input type="range" id="priceRangeMin" min="0" max="100" value="0" step="1" />
                <input type="range" id="priceRangeMax" min="0" max="100" value="100" step="1" />
              </div>
              <div class="price-filter__bounds"><span id="priceBoundMin">€0</span><span id="priceBoundMax">€100</span></div>
            </div>
          </div>

          <button type="button" class="shop-filterbar__clear-btn" id="clearFiltersBtn" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            Clear filters
          </button>

          <div class="shop-filterbar__stat shop-filterbar__stat--stock" id="stockStat" title="Total products in the catalog">
            <span class="shop-filterbar__stat-dot"></span>
            <span class="shop-filterbar__stat-text"><span class="shop-filterbar__stat-num" id="stockCount">0</span> <span id="stockLabel">Products</span></span>
          </div>
        </div>
      </div>

      <div class="product-grid" id="productGrid"></div>

    </main>
  </div>

  <!-- ─── CART PANEL ─── -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-panel" id="cartPanel">
    <div class="cart-panel__header">
      <div class="cart-panel__heading">
        <span class="cart-panel__heading-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg></span>
        <span class="cart-panel__title">Your Cart</span>
        <span class="cart-panel__count" id="cartPanelCount"></span>
      </div>
      <button class="btn-icon" id="cartPanelClose" aria-label="Close cart">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cart-panel__body" id="cartBody"></div>
    <div class="cart-panel__footer" id="cartFooter"></div>
  </div>

  <!-- ─── TOAST ─── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── CART INLINE FALLBACK ─── -->
  <script>
  (function() {
    var PANEL_STYLE = 'position:fixed!important;top:0!important;right:0!important;left:auto!important;bottom:0!important;width:390px!important;max-width:100vw!important;height:100vh!important;max-height:100vh!important;background:#09090b!important;border:none!important;border-left:1px solid rgba(255,255,255,.07)!important;border-radius:0!important;box-shadow:-24px 0 60px rgba(0,0,0,.55)!important;z-index:9999!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;transform:none!important;';
    var OVERLAY_STYLE = 'position:fixed!important;inset:0!important;background:rgba(0,0,0,.55)!important;z-index:9998!important;display:block!important;';

    function openCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.setAttribute('style', PANEL_STYLE); p.classList.add('open'); }
      if (o) { o.setAttribute('style', OVERLAY_STYLE); o.classList.add('open'); }
      document.body.style.overflow = 'hidden';
      try { if (window._renderCartPanel) window._renderCartPanel(); } catch(e) {}
    }
    function closeCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.removeAttribute('style'); p.classList.remove('open'); }
      if (o) { o.removeAttribute('style'); o.classList.remove('open'); }
      document.body.style.overflow = '';
    }
    window._openCart  = openCart;
    window._closeCart = closeCart;

    document.addEventListener('click', function(e) {
      var t = e.target;
      for (var i = 0; i < 12 && t && t !== document; i++) {
        if (t.id === 'cartBtn')        { openCart();  return; }
        if (t.id === 'cartPanelClose') { closeCart(); return; }
        if (t.id === 'cartOverlay')    { closeCart(); return; }
        t = t.parentNode;
      }
    }, true);
  })();
  </script>

  <script src="assets/content-sync.js?v=2"></script>
  <script src="assets/email-config.js?v=1"></script>
  <script src="assets/main.js?v=17"></script>
  <script src="assets/crypto-checkout.js?v=1"></script>
  <script>
  (function() {
    function applyLinks(l) {
      if (!l) return;
      document.querySelectorAll('[data-link]').forEach(function(el) {
        var key = el.getAttribute('data-link');
        if (l[key]) el.href = l[key];
      });
    }
    try { applyLinks(JSON.parse(localStorage.getItem('nexus_links'))); } catch(e) {}
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_links') { try { applyLinks(JSON.parse(e.newValue)); } catch(e) {} }
    });
  })();
  </script>
  <script>
  (function() {
    var DEFAULT_PRODUCTS = [];

    function getProducts() {
      try { return JSON.parse(localStorage.getItem('nexus_products')) || DEFAULT_PRODUCTS; } catch(e) { return DEFAULT_PRODUCTS; }
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    /* Note réelle calculée à partir des avis clients (nexus_reviews).
       Un avis appartient à un produit s'il a le même productId, ou à défaut le même nom.
       Seuls les avis publiés comptent. Champs note tolérés : stars ou rating. */
    function getReviews() {
      try { return JSON.parse(localStorage.getItem('nexus_reviews')) || []; } catch(e) { return []; }
    }
    function reviewStats(p) {
      var name = String(p.name || '').toLowerCase().trim();
      var matched = getReviews().filter(function(r) {
        if (r.published === false) return false;
        if (r.productId != null && String(r.productId) === String(p.id)) return true;
        if (name && r.product && String(r.product).toLowerCase().trim() === name) return true;
        return false;
      });
      if (!matched.length) return { count: 0, avg: 0 };
      var sum = matched.reduce(function(s, r) {
        var v = (r.stars != null) ? r.stars : (r.rating != null ? r.rating : 5);
        return s + Number(v);
      }, 0);
      return { count: matched.length, avg: sum / matched.length };
    }

    var CURRENCY_SYMBOLS = { EUR: '€', USD: '$', GBP: '£' };

    function buildCard(p, index) {
      var sym = '€'; /* Boutique en euros : tout le site en € */
      var gradient = p.gradient || 'linear-gradient(135deg,#1a1a2e,#16213e)';
      var icon = p.icon || '📦';

      // Badge label (texte, emoji et couleur personnalisables depuis l'admin)
      var labelCls = 'featured', labelTxt = NX_ICONS('star') + ' Featured', labelStyle = '';
      if (p.badge) {
        var BADGE_LEGACY = {
          HOT:  { txt: 'Best Seller', emoji: NX_ICONS('flame'),    cls: 'best' },
          NEW:  { txt: 'New Arrival', emoji: NX_ICONS('sparkles'), cls: 'new' },
          SALE: { txt: 'Sale',        emoji: NX_ICONS('tag'),      cls: 'sale' }
        };
        var legacy = BADGE_LEGACY[p.badge];
        var isCustomized = !!(p.badgeColor || p.badgeEmoji);
        var bTxt   = (legacy && !isCustomized) ? legacy.txt : p.badge;
        var bEmoji = p.badgeEmoji || (isCustomized ? '' : (legacy ? legacy.emoji : ''));
        labelCls = legacy ? legacy.cls : 'featured';
        labelTxt = (bEmoji ? bEmoji + ' ' : '') + esc(bTxt);
        if (p.badgeColor) {
          var bc = p.badgeColor;
          var n = parseInt(bc.replace('#',''), 16);
          var bg = 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',.18)';
          labelStyle = ' style="background:' + bg + ';color:' + bc + ';"';
        }
      }

      // Note réelle issue des avis clients ; aucune note tant qu'il n'y a pas d'avis
      var rstats = reviewStats(p);
      var ratingHtml = rstats.count
        ? '<span class="pc-rating">' + rstats.avg.toFixed(1) + ' <span class="pc-rating-count">(' + rstats.count + ')</span></span>'
        : '';

      // Stock
      var ct = {};
      try { ct = JSON.parse(localStorage.getItem('nexus_content')) || {}; } catch(e) {}
      var inStock = p.inStock !== false && p.stock !== 0;
      var stockHtml = inStock
        ? '<span class="pc-stock pc-stock--in">' + esc(ct.inStockLabel || 'In stock') + '</span>'
        : '<span class="pc-stock pc-stock--out">' + esc(ct.outOfStockLabel || 'Out of stock') + '</span>';

      // Price
      var priceHtml = p.origPrice
        ? '<span class="pc-price-orig">' + sym + Number(p.origPrice).toFixed(2) + '</span><span class="pc-price">' + sym + Number(p.price).toFixed(2) + '</span>'
        : '<span class="pc-price">' + sym + Number(p.price).toFixed(2) + '</span>';

      // Large overlay text – split name at first space
      var nameParts = (p.name || '').split(' ');
      var big1 = nameParts[0] || '';
      var big2 = nameParts.slice(1).join(' ') || '';

      // Store name watermark
      var storeName = ct.siteName || 'FlashShp';

      /* Hover "Buy Now" button (dailystore style) — shown on every card */
      var bagSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
      var buyHover = '<div class="pc-buy-hover"><span class="pc-buy-btn">' + bagSvg + esc(ct.buyNowLabel || 'Buy Now') + '</span></div>';

      /* Custom image → clean banner only (no default overlays). No image → designed fallback. */
      var thumbHtml;
      if (p.image) {
        thumbHtml =
          '<div class="pc-thumb pc-thumb--img">' +
            '<img class="pc-img" src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">' +
            '<div class="pc-label pc-label--' + labelCls + '"' + labelStyle + '>' + labelTxt + '</div>' +
            buyHover +
          '</div>';
      } else {
        thumbHtml =
          '<div class="pc-thumb" style="background:' + gradient + ';">' +
            '<div class="pc-label pc-label--' + labelCls + '"' + labelStyle + '>' + labelTxt + '</div>' +
            '<div class="pc-brand"><span class="pc-brand-icon">' + icon + '</span>' + esc(capitalize(p.category)) + '</div>' +
            '<div class="pc-big-text">' + esc(big1) + (big2 ? '<br>' + esc(big2) : '') + '</div>' +
            '<div class="pc-visual">' + icon + '</div>' +
            '<div class="pc-watermark">' + storeName + '</div>' +
            buyHover +
          '</div>';
      }

      return '<div class="product-card" style="--i:' + index + '" data-name="' + esc(p.name) + '" data-cat="' + esc(p.category) + '" data-price="' + p.price + '" data-product-id="' + p.id + '">' +
        thumbHtml +
        '<div class="pc-info">' +
          '<div class="pc-info-top">' + stockHtml + ratingHtml + '</div>' +
          '<div class="pc-title">' + esc(p.name) + '</div>' +
          '<div class="pc-price-row">' + priceHtml + '</div>' +
        '</div>' +
      '</div>';
    }

    function renderGrid() {
      var grid = document.getElementById('productGrid');
      if (!grid) return;
      var products = getProducts();
      grid.innerHTML = products.map(function(p, i) { return buildCard(p, i); }).join('');

      // Barre de filtres : "X Products" — nombre total de produits du catalogue
      var stockEl = document.getElementById('stockCount');
      if (stockEl) stockEl.textContent = products.length;

      if (window._nexusFilterAndSort) window._nexusFilterAndSort();
    }

    renderGrid();

    /* Le clic sur une carte produit est géré par assets/main.js (→ fiche produit). */

    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_products' || e.key === 'nexus_reviews') renderGrid();
    });
  })();
  </script>
  <script>
  (function() {
    function applyContent(c) {
      if (!c) return;
      if (c.siteName)      document.querySelectorAll('.nav__logo, .drawer__logo, .footer__logo').forEach(function(el) { el.textContent = c.siteName; });
      if (c.productsCountWord) { var e1 = document.getElementById('stockLabel'); if (e1) e1.textContent = c.productsCountWord; }
      if (c.searchPlaceholder) { var e2 = document.getElementById('searchInput'); if (e2) e2.placeholder = c.searchPlaceholder; }
      if (c.footerDesc)    document.querySelectorAll('.footer__desc').forEach(function(el) { el.innerHTML  = c.footerDesc; });
      if (c.footerCopy)    document.querySelectorAll('.footer__copy').forEach(function(el) { el.textContent = c.footerCopy; });
    }
    try { applyContent(JSON.parse(localStorage.getItem('nexus_content'))); } catch(e) {}
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_content') {
        try { applyContent(JSON.parse(e.newValue)); } catch(e2) {}
        /* labels des cartes et de la sidebar (Buy Now, stock, Featured…) sont générés au rendu */
        location.reload();
      }
    });
  })();
  </script>
  <script src="assets/account-menu.js?v=3" defer></script>
</body>
</html>
