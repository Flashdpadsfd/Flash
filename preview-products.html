  <!-- ─── CART INLINE FALLBACK ─── -->
  <script>
  (function() {
    var PANEL_STYLE = 'position:fixed!important;top:74px!important;right:18px!important;left:auto!important;bottom:auto!important;width:360px!important;max-width:calc(100vw - 36px)!important;max-height:calc(100vh - 96px)!important;background:#0a0a0a!important;border:1px solid rgba(255,255,255,.10)!important;border-radius:16px!important;box-shadow:0 24px 60px rgba(0,0,0,.6)!important;z-index:9999!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;transform:none!important;';
    var OVERLAY_STYLE = 'position:fixed!important;inset:0!important;background:transparent!important;z-index:9998!important;display:block!important;';

    function openCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.setAttribute('style', PANEL_STYLE); p.classList.add('open'); }
      if (o) { o.setAttribute('style', OVERLAY_STYLE); o.classList.add('open'); }
      document.body.style.overflow = 'hidden';
      try { if (window._renderCartPanel) window._renderCartPanel(); } catch(e) {}
    }
    function closeCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.removeAttribute('style'); p.classList.remove('open'); }
      if (o) { o.removeAttribute('style'); o.classList.remove('open'); }
      document.body.style.overflow = '';
    }
    window._openCart  = openCart;
    window._closeCart = closeCart;

    document.addEventListener('click', function(e) {
      var t = e.target;
      for (var i = 0; i < 12 && t && t !== document; i++) {
        if (t.id === 'cartBtn')        { openCart();  return; }
        if (t.id === 'cartPanelClose') { closeCart(); return; }
        if (t.id === 'cartOverlay')    { closeCart(); return; }
        t = t.parentNode;
      }
    }, true);
  })();
  </script>

  <script>
  (function() {
    /* Affiche uniquement les catégories créées dans l'admin.
       Aucune catégorie → la sidebar ne montre que la recherche et tous les produits restent visibles. */
    function getCats() {
      try { return JSON.parse(localStorage.getItem('nexus_categories')) || []; } catch(e) { return []; }
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function getProds() {
      try { return JSON.parse(localStorage.getItem('nexus_products')) || []; } catch(e) { return []; }
    }
    /* Produit rattaché à la catégorie → item qui FILTRE la grille sur ce produit
       (reste sur la page, comme l'écran). Sidebar épurée : pas d'icône sur les lignes produit. */
    function prodItemHtml(p, isChild) {
      return '<div class="sidebar__item sidebar__item--noicon' + (isChild ? ' sidebar__item--child' : '') + '" data-product-id="' + esc(p.id) + '" data-label="' + esc(p.name) + '">' +
        esc(p.name) + '</div>';
    }
    /* Un produit est « enfant » s'il pointe vers un produit parent existant. */
    function prodHasParent(p, prods) {
      return p.parentProduct && prods.some(function(x) { return String(x.id) === String(p.parentProduct); });
    }
    /* Un produit qui a des enfants reste une LIGNE produit normale ; ses enfants
       s'affichent comme des lignes produit indentées juste en dessous. Pas de section
       ni de chevron : ce n'est PAS une sous-catégorie, juste des produits dans un produit. */
    function renderProdEntry(p, prods) {
      var children = prods.filter(function(c) { return String(c.parentProduct) === String(p.id); });
      if (!children.length) return prodItemHtml(p);
      return prodItemHtml(p) + children.map(function(c) { return prodItemHtml(c, true); }).join('');
    }
    /* Rendu récursif : une catégorie (racine OU sous-catégorie) qui contient des
       sous-catégories et/ou des produits devient une section repliable contenant
       ses produits. On peut donc créer p.ex. « Negjxx » et y ranger plusieurs produits.
       Catégorie vide = en-tête seul cliquable (filtre la grille). */
    function renderNode(cat, cats, prods, depth, seen) {
      seen = seen || {};
      if (seen[cat.id] || depth > 6) return '';   /* garde-fou anti-boucle */
      seen[cat.id] = true;
      var subs = cats.filter(function(s) { return s.parent === cat.id; });
      /* Les produits enfants ne s'affichent QUE dans le groupe de leur parent. */
      var directProds = prods.filter(function(p) { return String(p.category) === String(cat.id) && !prodHasParent(p, prods); });
      var inner = subs.map(function(s) { return renderNode(s, cats, prods, depth + 1, seen); }).join('') +
        directProds.map(function(p) { return renderProdEntry(p, prods); }).join('');
      if (!inner) {
        return '<div class="sidebar__section' + (depth > 0 ? ' sidebar__section--nested' : '') + '">' +
          '<div class="sidebar__section-header sidebar__section-header--leaf" data-cat="' + cat.id + '" data-label="' + esc(cat.name) + '">' +
            '<span class="sidebar__section-title"><span class="sidebar__dot"></span>' + esc(cat.name) + '</span>' +
            '<span class="sidebar__line"></span>' +
          '</div>' +
        '</div>';
      }
      var bodyId = 'catsec-' + cat.id;
      return '<div class="sidebar__section' + (depth > 0 ? ' sidebar__section--nested' : '') + '">' +
        '<div class="sidebar__section-header" onclick="toggleSection(\'' + bodyId + '\')">' +
          '<span class="sidebar__section-title"><span class="sidebar__dot"></span>' + esc(cat.name) + '</span>' +
          '<span class="sidebar__line"></span>' +
          '<svg class="sidebar__section-arrow" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="sidebar__section-body" id="' + bodyId + '">' + inner + '</div>' +
      '</div>';
    }
    function renderCats() {
      var wrap = document.getElementById('catSections');
      if (!wrap) return;
      var cats = getCats();
      var prods = getProds();
      var roots = cats.filter(function(c) {
        return !c.parent || !cats.some(function(p) { return p.id === c.parent; });
      });
      wrap.innerHTML = roots.map(function(c) { return renderNode(c, cats, prods, 0, {}); }).join('');
    }
    renderCats();
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_categories' || e.key === 'nexus_products') renderCats();
    });
  })();
  </script>

  <script>
  (function() {
    function applyLinks(l) {
      if (!l) return;
      document.querySelectorAll('[data-link]').forEach(function(el) {
        var key = el.getAttribute('data-link');
        if (l[key]) el.href = l[key];
      });
    }
    try { applyLinks(JSON.parse(localStorage.getItem('nexus_links'))); } catch(e) {}
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_links') { try { applyLinks(JSON.parse(e.newValue)); } catch(e) {} }
    });
  })();
  </script>
  <script>
  (function() {
    var DEFAULT_PRODUCTS = [];

    function getProducts() {
      try { return JSON.parse(localStorage.getItem('nexus_products')) || DEFAULT_PRODUCTS; } catch(e) { return DEFAULT_PRODUCTS; }
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    /* Note réelle calculée à partir des avis clients (nexus_reviews).
       Un avis appartient à un produit s'il a le même productId, ou à défaut le même nom.
       Seuls les avis publiés comptent. Champs note tolérés : stars ou rating. */
    function getReviews() {
      try { return JSON.parse(localStorage.getItem('nexus_reviews')) || []; } catch(e) { return []; }
    }
    function reviewStats(p) {
      var name = String(p.name || '').toLowerCase().trim();
      var matched = getReviews().filter(function(r) {
        if (r.published === false) return false;
        if (r.productId != null && String(r.productId) === String(p.id)) return true;
        if (name && r.product && String(r.product).toLowerCase().trim() === name) return true;
        return false;
      });
      if (!matched.length) return { count: 0, avg: 0 };
      var sum = matched.reduce(function(s, r) {
        var v = (r.stars != null) ? r.stars : (r.rating != null ? r.rating : 5);
        return s + Number(v);
      }, 0);
      return { count: matched.length, avg: sum / matched.length };
    }

    var CURRENCY_SYMBOLS = { EUR: '€', USD: '$', GBP: '£' };

    function buildCard(p, index) {
      var sym = '€'; /* Boutique en euros : tout le site en € */
      var gradient = p.gradient || 'linear-gradient(135deg,#1a1a2e,#16213e)';
      var icon = p.icon || '📦';

      // Badge label (texte, emoji et couleur personnalisables depuis l'admin)
      var labelCls = 'featured', labelTxt = NX_ICONS('star') + ' Featured', labelStyle = '';
      if (p.badge) {
        var BADGE_LEGACY = {
          HOT:  { txt: 'Best Seller', emoji: NX_ICONS('flame'),    cls: 'best' },
          NEW:  { txt: 'New Arrival', emoji: NX_ICONS('sparkles'), cls: 'new' },
          SALE: { txt: 'Sale',        emoji: NX_ICONS('tag'),      cls: 'sale' }
        };
        var legacy = BADGE_LEGACY[p.badge];
        var isCustomized = !!(p.badgeColor || p.badgeEmoji);
        var bTxt   = (legacy && !isCustomized) ? legacy.txt : p.badge;
        var bEmoji = p.badgeEmoji || (isCustomized ? '' : (legacy ? legacy.emoji : ''));
        labelCls = legacy ? legacy.cls : 'featured';
        labelTxt = (bEmoji ? bEmoji + ' ' : '') + esc(bTxt);
        if (p.badgeColor) {
          var bc = p.badgeColor;
          var n = parseInt(bc.replace('#',''), 16);
          var bg = 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',.18)';
          labelStyle = ' style="background:' + bg + ';color:' + bc + ';"';
        }
      }

      // Note réelle issue des avis clients ; aucune note tant qu'il n'y a pas d'avis
      var rstats = reviewStats(p);
      var ratingHtml = rstats.count
        ? '<span class="pc-rating">' + rstats.avg.toFixed(1) + ' <span class="pc-rating-count">(' + rstats.count + ')</span></span>'
        : '';

      // Stock
      var ct = {};
      try { ct = JSON.parse(localStorage.getItem('nexus_content')) || {}; } catch(e) {}
      var inStock = p.inStock !== false && p.stock !== 0;
      var stockHtml = inStock
        ? '<span class="pc-stock pc-stock--in">' + esc(ct.inStockLabel || 'In stock') + '</span>'
        : '<span class="pc-stock pc-stock--out">' + esc(ct.outOfStockLabel || 'Out of stock') + '</span>';

      // Price
      var priceHtml = p.origPrice
        ? '<span class="pc-price-orig">' + sym + Number(p.origPrice).toFixed(2) + '</span><span class="pc-price">' + sym + Number(p.price).toFixed(2) + '</span>'
        : '<span class="pc-price">' + sym + Number(p.price).toFixed(2) + '</span>';

      // Large overlay text – split name at first space
      var nameParts = (p.name || '').split(' ');
      var big1 = nameParts[0] || '';
      var big2 = nameParts.slice(1).join(' ') || '';

      // Store name watermark
      var storeName = ct.siteName || 'FlashShp';

      /* Hover "Buy Now" button (dailystore style) — shown on every card */
      var bagSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
      var buyHover = '<div class="pc-buy-hover"><span class="pc-buy-btn">' + bagSvg + esc(ct.buyNowLabel || 'Buy Now') + '</span></div>';

      /* Custom image → clean banner only (no default overlays). No image → designed fallback. */
      var thumbHtml;
      if (p.image) {
        thumbHtml =
          '<div class="pc-thumb pc-thumb--img">' +
            '<img class="pc-img" src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">' +
            '<div class="pc-label pc-label--' + labelCls + '"' + labelStyle + '>' + labelTxt + '</div>' +
            buyHover +
          '</div>';
      } else {
        thumbHtml =
          '<div class="pc-thumb" style="background:' + gradient + ';">' +
            '<div class="pc-label pc-label--' + labelCls + '"' + labelStyle + '>' + labelTxt + '</div>' +
            '<div class="pc-brand"><span class="pc-brand-icon">' + icon + '</span>' + esc(capitalize(p.category)) + '</div>' +
            '<div class="pc-big-text">' + esc(big1) + (big2 ? '<br>' + esc(big2) : '') + '</div>' +
            '<div class="pc-visual">' + icon + '</div>' +
            '<div class="pc-watermark">' + storeName + '</div>' +
            buyHover +
          '</div>';
      }

      return '<div class="product-card" style="--i:' + index + '" data-name="' + esc(p.name) + '" data-cat="' + esc(p.category) + '" data-price="' + p.price + '" data-product-id="' + p.id + '">' +
        thumbHtml +
        '<div class="pc-info">' +
          '<div class="pc-info-top">' + stockHtml + ratingHtml + '</div>' +
          '<div class="pc-title">' + esc(p.name) + '</div>' +
          '<div class="pc-price-row">' + priceHtml + '</div>' +
        '</div>' +
      '</div>';
    }

    function renderGrid() {
      var grid = document.getElementById('productGrid');
      var countEl = document.getElementById('resultsCount');
      if (!grid) return;
      var products = getProducts();
      grid.innerHTML = products.map(function(p, i) { return buildCard(p, i); }).join('');
      if (countEl) countEl.textContent = products.length;
      if (window._nexusFilterAndSort) window._nexusFilterAndSort();
    }

    renderGrid();

    /* Le clic sur une carte produit est géré par assets/main.js (→ fiche produit). */

    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_products' || e.key === 'nexus_reviews') renderGrid();
    });
  })();
  </script>
  <script>
  (function() {
    function applyContent(c) {
      if (!c) return;
      if (c.siteName)      document.querySelectorAll('.nav__logo, .drawer__logo, .footer__logo').forEach(function(el) { el.textContent = c.siteName; });
      if (c.productsCountWord) { var e1 = document.getElementById('productsTitleLabel'); if (e1) e1.textContent = c.productsCountWord; }
      if (c.searchPlaceholder) { var e2 = document.getElementById('searchInput'); if (e2) e2.placeholder = c.searchPlaceholder; }
      if (c.footerDesc)    document.querySelectorAll('.footer__desc').forEach(function(el) { el.innerHTML  = c.footerDesc; });
      if (c.footerCopy)    document.querySelectorAll('.footer__copy').forEach(function(el) { el.textContent = c.footerCopy; });
    }
    try { applyContent(JSON.parse(localStorage.getItem('nexus_content'))); } catch(e) {}
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_content') {
        try { applyContent(JSON.parse(e.newValue)); } catch(e2) {}
        /* labels des cartes et de la sidebar (Buy Now, stock, Featured…) sont générés au rendu */
        location.reload();
      }
    });
  })();
  </script>
