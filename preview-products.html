<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Products Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lancelot&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=7" />
</head>
<body>

  <!-- ─── NAVIGATION ─── -->
  <nav class="nav">
    <div class="nav__inner">

      <a href="preview.html" class="nav__logo">Nexus</a>

      <ul class="nav__links">
        <li><a href="preview.html" data-i18n="nav.home">Home</a></li>
        <li><a href="preview-products.html" class="active" data-i18n="nav.shop">Products</a></li>
        <li><a href="preview-feedback.html" data-i18n="nav.reviews">Reviews</a></li>
      </ul>

      <div class="nav__actions">

        <button class="nav__lang" id="langToggle" aria-label="Language">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="opacity:.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
          <span id="langLabel">EN</span>
          <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="opacity:.35"><path d="M6 9l6 6 6-6"/></svg>
          <div class="lang-dropdown" id="langDropdown">
            <div class="lang-option selected" data-lang="EN">🇬🇧 English</div>
            <div class="lang-option" data-lang="FR">🇫🇷 Français</div>
            <div class="lang-option" data-lang="ES">🇪🇸 Español</div>
            <div class="lang-option" data-lang="DE">🇩🇪 Deutsch</div>
            <div class="lang-option" data-lang="IT">🇮🇹 Italiano</div>
            <div class="lang-option" data-lang="PT">🇵🇹 Português</div>
            <div class="lang-option" data-lang="AR">🇸🇦 العربية</div>
          </div>
        </button>

        <button class="nav__login" data-i18n="nav.login">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Sign In
        </button>

        <div class="nav__cart-wrap">
          <button class="btn-icon" id="cartBtn" aria-label="Cart" onclick="window._openCart && window._openCart()">
            <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          </button>
          <span class="nav__cart-count" id="cartCount">0</span>
        </div>

        <button class="btn-icon nav__hamburger" id="hamburger" aria-label="Menu">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

      </div>
    </div>
  </nav>

  <!-- ─── MOBILE DRAWER ─── -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer__header">
      <span class="drawer__logo">Nexus</span>
      <button class="btn-icon" id="drawerClose" aria-label="Close">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <ul class="drawer__links">
      <li><a href="preview.html" class="drawer-link" data-i18n="nav.home">Home</a></li>
      <li><a href="preview-products.html" class="drawer-link active" data-i18n="nav.shop">Shop</a></li>
      <li><a href="preview-feedback.html" class="drawer-link" data-i18n="nav.reviews">Reviews</a></li>
    </ul>
    <div style="margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:8px;">
      <button class="btn-primary btn-primary--lg" style="width:100%;border-radius:6px;" data-i18n="nav.login">Sign In</button>
      <button class="btn-ghost" style="width:100%;" data-i18n="nav.register">Create Account</button>
    </div>
  </div>

  <!-- ─── SHOP LAYOUT ─── -->
  <div class="shop-layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar__search">
        <svg class="sidebar__search-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="sidebar__search-input" id="searchInput" type="text" placeholder="Search products…" autocomplete="off" />
        <span class="sidebar__search-kbd">⌘K</span>
      </div>

      <div class="sidebar__section">
        <div class="sidebar__section-header" onclick="toggleSection('catSection')">
          <span class="sidebar__section-title">
            <span class="sidebar__dot"></span>
            Categories
          </span>
          <svg class="sidebar__section-arrow" width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="sidebar__section-body" id="catSection"></div>
      </div>

    </aside>

    <!-- ── MAIN ── -->
    <main class="shop-main">

      <div class="shop-topbar">
        <h1 class="shop-topbar__title" id="pageTitle">All Products</h1>
        <div class="shop-topbar__right">
          <span class="results-count" id="resultsCount">6 products</span>
          <select class="sort-select" id="sortSelect">
            <option value="default">Popular</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>

      <div class="product-grid" id="productGrid"></div>

    </main>
  </div>

  <!-- ─── CART PANEL ─── -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-panel" id="cartPanel">
    <div class="cart-panel__header">
      <div>
        <span class="cart-panel__title">Your Cart</span>
        <span class="cart-panel__count" id="cartPanelCount"></span>
      </div>
      <button class="btn-icon" id="cartPanelClose" aria-label="Close cart">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cart-panel__body" id="cartBody"></div>
    <div class="cart-panel__footer" id="cartFooter"></div>
  </div>

  <!-- ─── TOAST ─── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── CART INLINE FALLBACK ─── -->
  <script>
  (function() {
    var PANEL_STYLE = 'position:fixed!important;top:0!important;right:0!important;bottom:0!important;width:360px!important;max-width:100vw!important;background:#0d0d0d!important;border-left:1px solid rgba(255,255,255,.12)!important;box-shadow:-20px 0 40px rgba(0,0,0,.6)!important;z-index:9999!important;display:flex!important;flex-direction:column!important;transform:none!important;';
    var OVERLAY_STYLE = 'position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;background:rgba(0,0,0,.6)!important;z-index:9998!important;display:block!important;';

    function openCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.setAttribute('style', PANEL_STYLE); p.classList.add('open'); }
      if (o) { o.setAttribute('style', OVERLAY_STYLE); o.classList.add('open'); }
      document.body.style.overflow = 'hidden';
      try { if (window._renderCartPanel) window._renderCartPanel(); } catch(e) {}
    }
    function closeCart() {
      var p = document.getElementById('cartPanel');
      var o = document.getElementById('cartOverlay');
      if (p) { p.removeAttribute('style'); p.classList.remove('open'); }
      if (o) { o.removeAttribute('style'); o.classList.remove('open'); }
      document.body.style.overflow = '';
    }
    window._openCart  = openCart;
    window._closeCart = closeCart;

    document.addEventListener('click', function(e) {
      var t = e.target;
      for (var i = 0; i < 12 && t && t !== document; i++) {
        if (t.id === 'cartBtn')        { openCart();  return; }
        if (t.id === 'cartPanelClose') { closeCart(); return; }
        if (t.id === 'cartOverlay')    { closeCart(); return; }
        t = t.parentNode;
      }
    }, true);
  })();
  </script>

  <script>
  (function() {
    var DEFAULT_CATEGORIES = [
      { id: 'streaming', name: 'Streaming', icon: '▶', color: '#e50914' },
      { id: 'gaming',    name: 'Gaming',    icon: '🎮', color: '#64c864' },
      { id: 'software',  name: 'Software',  icon: '💻', color: '#6495ed' },
      { id: 'vpn',       name: 'VPN',       icon: '🔒', color: '#ffa01e' }
    ];
    function getCats() {
      try { return JSON.parse(localStorage.getItem('nexus_categories')) || DEFAULT_CATEGORIES; } catch(e) { return DEFAULT_CATEGORIES; }
    }
    function hexToRgba(hex, a) {
      var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return 'rgba('+r+','+g+','+b+','+a+')';
    }
    function renderCats() {
      var section = document.getElementById('catSection');
      if (!section) return;
      var html = '<div class="sidebar__item active" data-cat="all" data-label="All Products">' +
        '<span class="sidebar__item-icon" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);">🌐</span>All Products</div>';
      getCats().forEach(function(c) {
        var bg = hexToRgba(c.color, 0.15);
        html += '<div class="sidebar__item" data-cat="' + c.id + '" data-label="' + c.name + '">' +
          '<span class="sidebar__item-icon" style="background:' + bg + ';color:' + c.color + ';">' + (c.icon || '📦') + '</span>' +
          c.name + '</div>';
      });
      section.innerHTML = html;
    }
    renderCats();
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_categories') location.reload();
    });
  })();
  </script>
  <script src="assets/main.js?v=7"></script>
  <script>
  (function() {
    function applyLinks(l) {
      if (!l) return;
      document.querySelectorAll('[data-link]').forEach(function(el) {
        var key = el.getAttribute('data-link');
        if (l[key]) el.href = l[key];
      });
    }
    try { applyLinks(JSON.parse(localStorage.getItem('nexus_links'))); } catch(e) {}
    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_links') { try { applyLinks(JSON.parse(e.newValue)); } catch(e) {} }
    });
  })();
  </script>
  <script>
  (function() {
    var DEFAULT_PRODUCTS = [
      { id:1, name:'Netflix Premium', category:'streaming', price:4.99, origPrice:null, icon:'🎬', desc:'1 Month · 4K UHD · Shared', badge:'', gradient:'linear-gradient(135deg,#1a1a2e,#16213e)' },
      { id:2, name:'Spotify Premium', category:'streaming', price:8.99, origPrice:null, icon:'🎵', desc:'3 Months · Family Plan', badge:'HOT', gradient:'linear-gradient(135deg,#1e3a5f,#0a1628)' },
      { id:3, name:'Xbox Game Pass', category:'gaming', price:6.99, origPrice:null, icon:'🎮', desc:'1 Month · Ultimate', badge:'NEW', gradient:'linear-gradient(135deg,#2d1b69,#11053b)' },
      { id:4, name:'NordVPN', category:'vpn', price:12.99, origPrice:24.99, icon:'🔒', desc:'6 Months · Premium', badge:'', gradient:'linear-gradient(135deg,#1a3a1a,#0d1f0d)' },
      { id:5, name:'Disney+', category:'streaming', price:3.99, origPrice:null, icon:'📺', desc:'1 Month · 4K · Shared', badge:'SALE', gradient:'linear-gradient(135deg,#3a1a1a,#1f0d0d)' },
      { id:6, name:'Adobe Creative Cloud', category:'software', price:19.99, origPrice:null, icon:'🎨', desc:'1 Month · All Apps', badge:'', gradient:'linear-gradient(135deg,#1a2a3a,#0d1520)' }
    ];

    function getProducts() {
      try { return JSON.parse(localStorage.getItem('nexus_products')) || DEFAULT_PRODUCTS; } catch(e) { return DEFAULT_PRODUCTS; }
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    var CURRENCY_SYMBOLS = { EUR: '€', USD: '$', GBP: '£' };

    function buildCard(p) {
      var sym = CURRENCY_SYMBOLS[p.currency] || '$';
      var badge = '';
      if (p.badge) {
        var cls = p.badge === 'HOT' ? 'hot' : p.badge === 'NEW' ? 'new' : 'sale';
        badge = '<div class="product-card__badges"><span class="badge badge--' + cls + '">' + p.badge + '</span></div>';
      }
      var priceHtml = p.origPrice
        ? '<div><span class="product-card__price-orig">' + sym + Number(p.origPrice).toFixed(2) + '</span><span class="product-card__price">' + sym + Number(p.price).toFixed(2) + '</span></div>'
        : '<span class="product-card__price">' + sym + Number(p.price).toFixed(2) + '</span>';
      var gradient = p.gradient || 'linear-gradient(135deg,#1a1a2e,#16213e)';
      var cardBg = p.image
        ? 'background-image:url(' + p.image + ');background-size:cover;background-position:center;'
        : 'background:' + gradient + ';';
      var icon = p.icon || '📦';
      return '<div class="product-card" data-name="' + esc(p.name) + '" data-cat="' + esc(p.category) + '" data-price="' + p.price + '">' +
        '<div class="product-card__img" style="' + cardBg + '">' +
          '<span class="product-card__img-icon">' + icon + '</span>' +
          badge +
        '</div>' +
        '<div class="product-card__body">' +
          '<div class="product-card__cat">' + capitalize(p.category) + '</div>' +
          '<div class="product-card__name">' + esc(p.name) + '</div>' +
          '<div class="product-card__desc">' + esc(p.desc || '') + '</div>' +
        '</div>' +
        '<div class="product-card__footer">' +
          priceHtml +
          '<button class="btn-buy">Buy Now</button>' +
        '</div>' +
      '</div>';
    }

    function renderGrid() {
      var grid = document.getElementById('productGrid');
      var countEl = document.getElementById('resultsCount');
      if (!grid) return;
      var products = getProducts();
      grid.innerHTML = products.map(buildCard).join('');
      if (countEl) countEl.textContent = products.length + ' product' + (products.length !== 1 ? 's' : '');
      if (window._nexusFilterAndSort) window._nexusFilterAndSort();
    }

    renderGrid();

    window.addEventListener('storage', function(e) {
      if (e.key === 'nexus_products') renderGrid();
    });
  })();
  </script>
</body>
</html>
