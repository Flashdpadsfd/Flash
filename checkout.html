<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashShp — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: #080808; color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; line-height: 20px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    input { font-family: inherit; }

    /* ── Layout ── */
    .co-page {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px 64px;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    .co-header {
      padding: 24px 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.06);
      margin-bottom: 32px;
    }
    .co-logo {
      font-size: 16px; font-weight: 700; color: #fff;
      letter-spacing: -.2px;
    }
    .co-logo a { color: inherit; }

    /* ── Breadcrumb ── */
    .co-breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: rgba(255,255,255,.3);
    }
    .co-breadcrumb__step { font-weight: 500; }
    .co-breadcrumb__step.active { color: #fff; }
    .co-breadcrumb__step.done  { color: rgba(255,255,255,.5); }
    .co-breadcrumb__arrow { font-size: 10px; opacity: .3; }

    /* ── Two column grid ── */
    .co-grid {
      display: grid; grid-template-columns: 1fr 380px;
      gap: 28px; align-items: start;
    }

    /* ── Cards ── */
    .co-card {
      background: #0d0d0d; border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; overflow: hidden;
    }
    .co-card__hdr {
      padding: 20px 24px 14px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .co-card__title {
      font-size: 16px; font-weight: 700; color: #fff;
      margin-bottom: 3px;
    }
    .co-card__sub { font-size: 12px; color: rgba(255,255,255,.38); }
    .co-card__body { padding: 20px 24px; }

    /* ── Form fields ── */
    .co-field { display: flex; flex-direction: column; gap: 6px; }
    .co-field-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
    }
    .co-field input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
      border-radius: 9px; color: #fff; font-size: 14px;
      transition: border-color 150ms;
      outline: none;
    }
    .co-field input:focus { border-color: rgba(255,255,255,.25); }
    .co-field input.err { border-color: rgba(239,68,68,.5); }

    .co-divider {
      height: 1px; background: rgba(255,255,255,.06);
      margin: 20px 0;
    }

    /* ── Promo code ── */
    .co-promo-row {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .co-promo-input {
      flex: 1; padding: 10px 14px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
      border-radius: 9px; color: #fff; font-size: 13px;
      outline: none; transition: border-color 150ms;
    }
    .co-promo-input:focus { border-color: rgba(255,255,255,.22); }
    .co-promo-input::placeholder { color: rgba(255,255,255,.25); letter-spacing: .04em; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .co-promo-apply {
      padding: 0 18px; border-radius: 9px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600;
      transition: background 150ms, color 150ms;
    }
    .co-promo-apply:hover { background: rgba(255,255,255,.12); color: #fff; }
    .co-promo-msg { font-size: 12px; margin-top: 6px; }
    .co-err-msg { font-size: 12px; color: rgba(239,68,68,.85); margin-top: 6px; }

    /* ── Pay button ── */
    .co-continue-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px;
      background: #fff; color: #000;
      border-radius: 9px; font-size: 14px; font-weight: 700;
      margin-top: 20px;
      transition: background 200ms, transform 100ms;
    }
    .co-continue-btn:hover { background: #f0f0f0; }
    .co-continue-btn:active { transform: scale(.99); }
    .co-continue-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Right: Cart summary ── */
    .co-cart-item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .co-cart-item:last-child { border-bottom: none; }
    .co-cart-img {
      width: 64px; height: 64px; border-radius: 9px; flex-shrink: 0;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .co-cart-info { flex: 1; }
    .co-cart-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 3px; }
    .co-cart-each { font-size: 12px; color: rgba(255,255,255,.38); }
    .co-cart-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .co-cart-price { font-size: 15px; font-weight: 700; }

    .co-sum-rows { display: flex; flex-direction: column; gap: 0; }
    .co-sum-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; font-size: 13px; color: rgba(255,255,255,.5);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .co-sum-row:last-child { border-bottom: none; }
    .co-sum-row--total {
      font-size: 15px; font-weight: 700; color: #fff;
      padding: 12px 0 4px;
    }

    .co-discount-section { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.06); }

    .co-warranty {
      padding: 12px 16px; margin: 0 24px 16px;
      background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
      border-radius: 8px; font-size: 11px; color: rgba(255,255,255,.3); line-height: 1.6;
    }
    .co-warranty a { color: rgba(99,102,241,.7); text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .co-grid { grid-template-columns: 1fr; }
      .co-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>

<div class="co-page">

  <!-- Header -->
  <div class="co-header">
    <div class="co-logo"><a href="/" id="siteLogo">FlashShp</a></div>
    <div class="co-breadcrumb">
      <span class="co-breadcrumb__step done" id="bcCart">Cart</span>
      <span class="co-breadcrumb__arrow">›</span>
      <span class="co-breadcrumb__step active" id="bcCheckout">Checkout</span>
    </div>
  </div>

  <!-- ════════════ CHECKOUT ════════════ -->
  <div class="co-grid">

    <!-- Left -->
    <div style="display:flex;flex-direction:column;gap:16px;">

      <!-- Payment -->
      <div class="co-card">
        <div class="co-card__hdr">
          <div class="co-card__title">Payment</div>
          <div class="co-card__sub">You'll enter your email and choose a payment method in the secure checkout window.</div>
        </div>
        <div class="co-card__body">

          <!-- Promo -->
          <div style="margin-bottom:4px;">
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:10px;">
              <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              Discount Code
            </div>
            <div class="co-promo-row">
              <input class="co-promo-input" type="text" id="promoInput" placeholder="ENTER CODE" />
              <button class="co-promo-apply" id="promoBtn">Apply</button>
            </div>
            <div class="co-promo-msg" id="promoMsg"></div>
          </div>

          <div class="co-err-msg" id="payErr" style="display:none;"></div>

          <button class="co-continue-btn" id="payNowBtn">
            Pay Now
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>

        </div>
      </div>

    </div>

    <!-- Right: Cart summary -->
    <div style="display:flex;flex-direction:column;gap:16px;">

      <div class="co-card">
        <div class="co-card__hdr">
          <div class="co-card__title">Your Cart</div>
          <div class="co-card__sub">Review your items before checkout</div>
        </div>
        <div style="padding:0 24px;" id="cartItems">
          <!-- Rendered by JS -->
        </div>
        <div class="co-discount-section">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <div class="co-sum-rows" id="cartSumRows">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>
        <div class="co-warranty" id="warrantyNote" style="display:none;">
          <!-- Optional warranty note -->
        </div>
      </div>

    </div>

  </div>

</div>

  <script src="assets/content-sync.js?v=2"></script>
<script>
(function() {
  'use strict';

  /* ── Storage helpers ── */
  function getProds() {
    try { return JSON.parse(localStorage.getItem('nexus_products')) || []; } catch(e) { return []; }
  }
  function getContent() { try { return JSON.parse(localStorage.getItem('nexus_content') || '{}'); } catch(e) { return {}; } }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ── State ── */
  var params = new URLSearchParams(window.location.search);
  var pid = parseInt(params.get('id') || '0', 10);
  var allProds = getProds();
  var product = allProds.find(function(x) { return x.id === pid; });
  if (!product) { window.location.href = '/products'; return; }

  /* ── Variante choisie (?variant=index) : surcharge le nom affiché + le prix unitaire ── */
  (function applyVariant() {
    var vi = params.get('variant');
    if (vi == null || vi === '') return;
    var idx = parseInt(vi, 10);
    var vlist = Array.isArray(product.variants) ? product.variants : [];
    if (!vlist[idx]) return;
    /* Copie locale pour ne pas muter le produit stocké ; tout l'aval lit product.name/price */
    product = Object.assign({}, product, {
      name: product.name + ' — ' + vlist[idx].name,
      price: Number(vlist[idx].price)
    });
  })();

  var appliedPromo = null;

  /* ── Apply site name ── */
  var c = getContent();
  if (c.siteName) { document.getElementById('siteLogo').textContent = c.siteName; document.title = c.siteName + ' — Checkout'; }

  /* ── Render cart ── */
  var sym = '€'; /* tout le site en € */
  var basePrice = Number(product.price);

  /* Reduction fixe OU pourcentage, jamais negative. */
  function discountAmount(price, promo) {
    if (!promo) return 0;
    var raw = promo.type === 'fixed' ? Number(promo.discount) : (price * Number(promo.discount) / 100);
    return Math.min(price, Math.max(0, raw));
  }
  function discountLabel(promo) {
    return promo.type === 'fixed' ? ('-€' + Number(promo.discount).toFixed(2)) : ('-' + promo.discount + '%');
  }
  function getFinalPrice() {
    return basePrice - discountAmount(basePrice, appliedPromo);
  }

  function renderCart() {
    var fp = getFinalPrice();
    var thumbHtml = product.image
      ? '<img src="' + esc(product.image) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">'
      : (product.icon || '📦');
    document.getElementById('cartItems').innerHTML =
      '<div class="co-cart-item">' +
        '<div class="co-cart-img">' + thumbHtml + '</div>' +
        '<div class="co-cart-info">' +
          '<div class="co-cart-name">' + esc(product.name) + '</div>' +
          '<div class="co-cart-each">' + sym + fp.toFixed(2) + ' each</div>' +
        '</div>' +
        '<div class="co-cart-right">' +
          '<div class="co-cart-price">' + sym + fp.toFixed(2) + '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('cartSumRows').innerHTML =
      '<div class="co-sum-row"><span>Subtotal</span><span>' + sym + fp.toFixed(2) + '</span></div>' +
      '<div class="co-sum-row"><span>Tax</span><span>' + sym + '0.00</span></div>' +
      (appliedPromo ? '<div class="co-sum-row" style="color:rgba(99,235,132,.8)"><span>Discount (' + discountLabel(appliedPromo) + ')</span><span>-' + sym + discountAmount(basePrice, appliedPromo).toFixed(2) + '</span></div>' : '') +
      '<div class="co-sum-row co-sum-row--total"><span>Total</span><span>' + sym + fp.toFixed(2) + '</span></div>';
  }
  renderCart();

  /* ── Promo code ──
     Jamais validé côté client : /api/coupon-validate seul connaît la liste des
     coupons (via SellAuth) — voir la note dans api/_sellauth-coupons.js. Ce
     code est une prévisualisation ; le client SellAuth a son propre champ
     coupon dans la fenêtre de paiement, qui reste la validation qui compte
     réellement pour la remise appliquée à la facture. */
  document.getElementById('promoBtn').addEventListener('click', function() {
    var code = (document.getElementById('promoInput').value || '').trim().toUpperCase();
    var msgEl = document.getElementById('promoMsg');
    if (!code) { msgEl.textContent = 'Enter a promo code.'; msgEl.style.color = 'rgba(239,68,68,.8)'; return; }
    msgEl.textContent = 'Checking…'; msgEl.style.color = 'rgba(255,255,255,.4)';
    fetch('/api/coupon-validate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, email: '', cartTotal: basePrice, productId: product.id })
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (!res || !res.ok) { msgEl.textContent = 'Service unavailable.'; msgEl.style.color = 'rgba(239,68,68,.8)'; appliedPromo = null; renderCart(); return; }
        if (!res.valid) {
          var reasons = {
            invalid: 'Invalid code.', expired: 'Code expired.', not_started: 'Code not active yet.',
            max_uses: 'Code fully redeemed.', max_uses_per_customer: 'Already used the max times.',
            min_cart: 'Cart total too low for this code.', email_not_allowed: 'Code reserved for another email.',
            product_not_eligible: 'Code not valid on this product.'
          };
          msgEl.textContent = reasons[res.reason] || 'Invalid code.'; msgEl.style.color = 'rgba(239,68,68,.8)'; appliedPromo = null;
        } else {
          appliedPromo = { code: code, discount: res.discount, type: res.type };
          msgEl.textContent = '✓ Code applied — ' + discountLabel(appliedPromo) + '. Enter it again in the payment window to redeem it.';
          msgEl.style.color = 'rgba(99,235,132,.9)';
        }
        renderCart();
      })
      .catch(function() { msgEl.textContent = 'Network error.'; msgEl.style.color = 'rgba(239,68,68,.8)'; appliedPromo = null; renderCart(); });
  });

  /* ── SellAuth checkout link ──
     Redirection directe vers la page de paiement hébergée par SellAuth sur
     son domaine (SELLAUTH_CHECKOUT_DOMAIN) — voir docs.sellauth.com/developers/
     checkout-links. Remplace le widget JS embed (sellauth-embed-2.js) : celui-ci
     échouait de façon systématique avec "Captcha timeout" avant même d'afficher
     la moindre modale, alors qu'un lien direct fonctionne. Le paiement (email,
     méthode, facturation) est entièrement géré par SellAuth sur sa propre page
     — voir _sellauth-invoice.js / sellauth-webhook.js côté serveur pour la
     suite (email de livraison, notification Discord, historique de commandes)
     une fois la facture payée. */
  var payBtn = document.getElementById('payNowBtn');
  var payErr = document.getElementById('payErr');
  var payBtnDefaultHtml = payBtn.innerHTML;

  function showPayErr(msg) {
    payErr.textContent = msg;
    payErr.style.display = '';
  }

  payBtn.addEventListener('click', function() {
    payErr.style.display = 'none';

    var productId = product.sellauthProductId;
    var variantId = product.sellauthVariantId;
    if (!productId) {
      showPayErr('This product isn\'t linked to payments yet — please contact support.');
      return;
    }

    payBtn.disabled = true; payBtn.textContent = 'Loading…';

    fetch('/api/sellauth-shop')
      .then(function(r) { return r.json(); })
      .then(function(cfg) {
        if (!cfg || !cfg.ok || !cfg.checkoutDomain) throw new Error('Checkout not configured');
        var url = 'https://' + cfg.checkoutDomain + '/checkout-link?' +
          'cart[0][productId]=' + encodeURIComponent(productId) +
          (variantId ? '&cart[0][variantId]=' + encodeURIComponent(variantId) : '') +
          '&cart[0][quantity]=1';
        window.location.href = url;
      })
      .catch(function() {
        payBtn.disabled = false; payBtn.innerHTML = payBtnDefaultHtml;
        showPayErr('Payment is temporarily unavailable. Please try again shortly.');
      });
  });

}());
</script>

</body>
</html>
