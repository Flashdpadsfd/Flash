<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashShp — Sign in</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lancelot&family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#08080a; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.22); --mut:rgba(255,255,255,.5); --faint:rgba(255,255,255,.35); }
    *{box-sizing:border-box;}
    html,body{margin:0;background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

    .cl-bg{position:fixed;inset:0;width:100%;height:100%;border:0;filter:blur(6px) brightness(.5) saturate(1.1);
      transform:scale(1.03);pointer-events:none;z-index:0;}
    .cl-dim{position:fixed;inset:0;background:rgba(4,4,6,.55);z-index:1;pointer-events:none;}

    .cl-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;z-index:2;}
    .cl-wrap::before{content:'';position:absolute;left:50%;top:-10%;width:820px;height:480px;transform:translateX(-50%);
      background:radial-gradient(ellipse at center, rgba(255,255,255,.05), transparent 62%);pointer-events:none;}

    .cl-card{position:relative;width:100%;max-width:420px;background:rgba(20,20,24,.55);backdrop-filter:blur(22px) saturate(1.3);
      -webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--bd);
      border-radius:18px;padding:36px 32px 30px;box-shadow:0 30px 70px rgba(0,0,0,.55);}
    .cl-close{position:absolute;top:16px;right:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      border-radius:9px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .15s,background .15s;}
    .cl-close:hover{color:#fff;background:rgba(255,255,255,.08);}

    .cl-word{font-family:'Instrument Serif',Georgia,serif;font-size:27px;text-align:center;margin-bottom:14px;}

    .cl-eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
    .cl-eyebrow-line{width:26px;height:1px;background:rgba(255,255,255,.28);}
    .cl-eyebrow-text{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);}

    .cl-tabs{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:26px;}
    .cl-tab{background:none;border:none;padding:0 0 3px;font-family:inherit;font-size:14px;font-weight:600;
      color:rgba(255,255,255,.4);cursor:pointer;border-bottom:1.5px solid transparent;transition:color .15s,border-color .15s;}
    .cl-tab:hover{color:rgba(255,255,255,.75);}
    .cl-tab.active{color:#fff;border-bottom-color:#fff;}
    .cl-tabs-dot{color:rgba(255,255,255,.2);font-size:13px;}

    .cl-title{font-family:'Lancelot','Times New Roman',Georgia,serif;font-weight:400;font-size:26px;line-height:1.2;margin:0 0 8px;text-align:center;}
    .cl-sub{font-size:13px;color:var(--mut);line-height:1.55;margin:0 0 24px;text-align:center;}
    .cl-sub b{color:#fff;font-weight:600;}

    .cl-pw-row{display:grid;grid-template-columns:1fr;gap:10px;}
    .cl-pw-row.cl-pw-row--split{grid-template-columns:1fr 1fr;}
    .cl-field{margin-bottom:14px;}
    .cl-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:rgba(255,255,255,.35);margin-bottom:7px;}
    .cl-field label .req{color:#f87171;}
    .cl-input{width:100%;height:44px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--bd);
      color:#fff;font-family:inherit;font-size:14px;padding:0 13px;transition:border-color .15s,background .15s;}
    .cl-input:focus{outline:none;border-color:var(--bd2);background:rgba(255,255,255,.06);}
    .cl-input::placeholder{color:rgba(255,255,255,.26);}

    .cl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:8px;
      font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border:none;color:#000;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);transition:background .15s,box-shadow .2s;margin-top:6px;}
    .cl-btn:hover{background:#f0f0f0;box-shadow:0 4px 6px rgba(0,0,0,.15);}
    .cl-btn[disabled]{opacity:.5;cursor:not-allowed;}

    .cl-otp{display:flex;gap:8px;justify-content:center;margin:4px 0 20px;}
    .cl-otp input{width:44px;height:52px;border-radius:9px;background:rgba(255,255,255,.03);border:1.5px solid var(--bd);
      color:#fff;font-family:'Plus Jakarta Sans',monospace;font-size:22px;font-weight:600;text-align:center;transition:border-color .12s,background .12s;}
    .cl-otp input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.07);}
    .cl-otp input.filled{border-color:var(--bd2);}
    @media (max-width:380px){ .cl-otp input{width:38px;height:48px;font-size:19px;} }

    .cl-link{margin-top:14px;display:block;width:100%;text-align:center;background:none;border:none;color:var(--mut);
      font-size:12.5px;cursor:pointer;font-family:inherit;}
    .cl-link:hover{color:#fff;}
    .cl-foot{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.6;}

    .cl-msg{margin-bottom:16px;font-size:12.5px;padding:10px 13px;border-radius:9px;display:none;text-align:center;}
    .cl-msg.show{display:block;}
    .cl-msg--err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);color:#fda4a4;}
    .cl-msg--ok{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.72);}
  </style>
</head>
<body>
  <iframe class="cl-bg" src="/" tabindex="-1" aria-hidden="true"></iframe>
  <div class="cl-dim"></div>
  <div class="cl-wrap">
    <div class="cl-card">
      <a class="cl-close" href="/" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </a>

      <div class="cl-word">FlashShp</div>
      <div class="cl-eyebrow">
        <div class="cl-eyebrow-line"></div>
        <span class="cl-eyebrow-text">Member Access</span>
        <div class="cl-eyebrow-line"></div>
      </div>

      <div class="cl-msg cl-msg--err" id="clErr"></div>
      <div class="cl-msg cl-msg--ok" id="clOk">You have been signed out.</div>

      <!-- Step 1 : choose method -->
      <div id="clStep1">
        <div class="cl-tabs" role="tablist">
          <button type="button" class="cl-tab active" id="clTabSignIn" role="tab" aria-selected="true">Sign In</button>
          <span class="cl-tabs-dot">&middot;</span>
          <button type="button" class="cl-tab" id="clTabRegister" role="tab" aria-selected="false">Register</button>
        </div>

        <div class="cl-title" id="clStepTitle">Access your account</div>
        <div class="cl-sub" id="clStepSub">Enter your password — we'll also email you a quick code to confirm it's you.</div>

        <form id="clEmailForm" autocomplete="on">
          <div class="cl-field">
            <label for="clEmail">Email <span class="req">*</span></label>
            <input class="cl-input" type="email" id="clEmail" placeholder="you@email.com" required autocomplete="email" />
          </div>

          <div class="cl-pw-row" id="clPwRow">
            <div class="cl-field" id="clPasswordGroup">
              <label for="clPassword">Password <span class="req">*</span></label>
              <input class="cl-input" type="password" id="clPassword" placeholder="Enter your password" autocomplete="current-password" />
            </div>

            <div class="cl-field" id="clConfirmGroup" style="display:none;">
              <label for="clConfirm">Confirm <span class="req">*</span></label>
              <input class="cl-input" type="password" id="clConfirm" placeholder="Confirm password" autocomplete="new-password" />
            </div>
          </div>

          <button class="cl-btn" type="submit" id="clSendBtn">Sign In</button>
        </form>

        <button class="cl-link" type="button" id="clMethodToggle">Use an email code instead</button>
        <div class="cl-foot" id="clFoot">New here? <b>Register</b> above to get started.</div>
      </div>

      <!-- Step 2 : verify code -->
      <div id="clStep2" style="display:none;">
        <div class="cl-title" id="clStep2Title">Enter your code</div>
        <div class="cl-sub">We sent a 6-digit code to <b id="clVMail"></b></div>

        <form id="clCodeForm" autocomplete="off">
          <div class="cl-otp" id="clOtp">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>
          <button class="cl-btn" type="submit" id="clVerifyBtn">Verify &amp; sign in</button>
          <button class="cl-link" type="button" id="clResend">Resend code</button>
          <button class="cl-link" type="button" id="clReset" style="margin-top:2px;">← Use a different email</button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var ERRORS = {
      server: "Something went wrong. Please try again later."
    };
    var errBox = document.getElementById('clErr');
    var okBox = document.getElementById('clOk');
    var step1 = document.getElementById('clStep1');
    var step2 = document.getElementById('clStep2');
    var emailForm = document.getElementById('clEmailForm');
    var codeForm = document.getElementById('clCodeForm');
    var emailInput = document.getElementById('clEmail');
    var passwordInput = document.getElementById('clPassword');
    var passwordGroup = document.getElementById('clPasswordGroup');
    var pwRow = document.getElementById('clPwRow');
    var confirmGroup = document.getElementById('clConfirmGroup');
    var confirmInput = document.getElementById('clConfirm');
    var sendBtn = document.getElementById('clSendBtn');
    var verifyBtn = document.getElementById('clVerifyBtn');
    var methodToggle = document.getElementById('clMethodToggle');
    var footEl = document.getElementById('clFoot');
    var step2Title = document.getElementById('clStep2Title');
    var otp = Array.prototype.slice.call(document.querySelectorAll('#clOtp input'));
    var currentEmail = '';
    var verifying = false;   /* garde anti-double-envoi (évite un "Network error" fantôme) */

    if (params.get('error')) { errBox.textContent = ERRORS[params.get('error')] || ('Sign-in error (' + params.get('error') + ').'); errBox.classList.add('show'); }
    if (params.get('loggedout')) okBox.classList.add('show');

    function showErr(m){ okBox.classList.remove('show'); errBox.textContent=m; errBox.classList.add('show'); }
    function showOk(m){ errBox.classList.remove('show'); okBox.textContent=m; okBox.classList.add('show'); }

    /* ── Tab (Sign In / Register) × Method (password / email code) ──
       4 combinations, 2 real backends: password path hits
       auth-password-login / auth-password-register ; code path always hits
       auth-email-request + the shared OTP step (which also happens to be
       how a pending password gets confirmed — see auth-email-verify.js). */
    var tabSignIn = document.getElementById('clTabSignIn');
    var tabRegister = document.getElementById('clTabRegister');
    var stepTitle = document.getElementById('clStepTitle');
    var stepSub = document.getElementById('clStepSub');
    var tab = 'signin';     // 'signin' | 'register'
    var method = 'password'; // 'password' | 'code'

    function render() {
      tabSignIn.classList.toggle('active', tab === 'signin');
      tabRegister.classList.toggle('active', tab === 'register');
      tabSignIn.setAttribute('aria-selected', String(tab === 'signin'));
      tabRegister.setAttribute('aria-selected', String(tab === 'register'));

      var usePw = method === 'password';
      passwordGroup.style.display = usePw ? '' : 'none';
      passwordInput.required = usePw;
      passwordInput.autocomplete = tab === 'register' ? 'new-password' : 'current-password';

      var showConfirm = usePw && tab === 'register';
      confirmGroup.style.display = showConfirm ? '' : 'none';
      confirmInput.required = showConfirm;
      pwRow.classList.toggle('cl-pw-row--split', showConfirm);
      if (!showConfirm) { confirmInput.value = ''; }

      if (tab === 'signin') {
        stepTitle.textContent = 'Access your account';
        stepSub.textContent = usePw ? "Enter your password — we'll also email you a quick code to confirm it's you." : "Enter your email and we'll send a one-time code to sign in.";
        sendBtn.textContent = usePw ? 'Sign In' : 'Send me a code';
        methodToggle.textContent = usePw ? 'Use an email code instead' : '← Use a password instead';
        footEl.innerHTML = '';
        footEl.appendChild(document.createTextNode('New here? '));
        var b1 = document.createElement('b'); b1.textContent = 'Register'; footEl.appendChild(b1);
        footEl.appendChild(document.createTextNode(' above to get started.'));
      } else {
        stepTitle.textContent = 'Create your account';
        stepSub.textContent = usePw ? 'Set a password to save your orders and get faster support.' : "Enter your email and we'll send a code to get you started.";
        sendBtn.textContent = usePw ? 'Create Account' : 'Send me a code';
        methodToggle.textContent = usePw ? 'Use just an email code instead' : '← Set a password instead';
        footEl.innerHTML = '';
        footEl.appendChild(document.createTextNode('Prefer no password? '));
        var b2 = document.createElement('b'); b2.textContent = 'Just your inbox'; footEl.appendChild(b2);
        footEl.appendChild(document.createTextNode(' works too.'));
      }
    }
    tabSignIn.addEventListener('click', function () { tab = 'signin'; method = 'password'; render(); });
    tabRegister.addEventListener('click', function () { tab = 'register'; method = 'password'; render(); });
    methodToggle.addEventListener('click', function () { method = method === 'password' ? 'code' : 'password'; render(); });
    render();

    /* ── OTP boxes behaviour ── */
    function getCode(){ return otp.map(function(i){ return i.value; }).join(''); }
    otp.forEach(function (box, idx) {
      box.addEventListener('input', function () {
        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
        box.classList.toggle('filled', !!box.value);
        if (box.value && idx < 5) otp[idx + 1].focus();
        if (getCode().length === 6) codeForm.requestSubmit ? codeForm.requestSubmit() : submitCode();
      });
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !box.value && idx > 0) { otp[idx - 1].focus(); otp[idx - 1].value = ''; otp[idx - 1].classList.remove('filled'); e.preventDefault(); }
        if (e.key === 'ArrowLeft' && idx > 0) otp[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < 5) otp[idx + 1].focus();
      });
      box.addEventListener('paste', function (e) {
        e.preventDefault();
        var digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6).split('');
        otp.forEach(function (b, i) { b.value = digits[i] || ''; b.classList.toggle('filled', !!b.value); });
        (otp[Math.min(digits.length, 5)] || otp[5]).focus();
        if (digits.length === 6) submitCode();
      });
    });

    function toStep2(email, title){
      currentEmail = email;
      document.getElementById('clVMail').textContent = email;
      step2Title.textContent = title || 'Enter your code';
      okBox.classList.remove('show'); errBox.classList.remove('show');
      step1.style.display = 'none';
      step2.style.display = 'block';
      setTimeout(function(){ otp[0].focus(); }, 60);
    }

    function requestCode(email, purpose, btn, label){
      btn.disabled = true; btn.textContent = 'Sending…';
      return fetch('/api/auth-email-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Code sent to ' + email + '. Check your inbox (and spam).'); return true; }
          if (res.status === 429) showErr((res.body && res.body.error) || 'Too many requests. Try again in a minute.');
          else if (res.status === 501) showErr('Email sign-in is temporarily unavailable. Please try again later.');
          else showErr((res.body && res.body.error) || 'Could not send the code. Try again.');
          return false;
        })
        .catch(function(){ showErr('Network error. Please try again.'); return false; })
        .then(function(ok){ btn.disabled = false; btn.textContent = label; return ok; });
    }

    /* Inscription par mot de passe : hachage + envoi du code côté serveur,
       le mot de passe n'est activé qu'après vérification (même étape 2). */
    function requestPasswordRegister(email, password, btn, label){
      btn.disabled = true; btn.textContent = 'Sending…';
      return fetch('/api/auth-password-register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email, password: password }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Code sent to ' + email + '. Confirm it to finish creating your account.'); return true; }
          showErr((res.body && res.body.error) || 'Could not create the account. Try again.');
          return false;
        })
        .catch(function(){ showErr('Network error. Please try again.'); return false; })
        .then(function(ok){ btn.disabled = false; btn.textContent = label; return ok; });
    }

    /* Le mot de passe n'ouvre jamais la session à lui seul : s'il est correct,
       le serveur envoie un code et on passe à l'étape 2, comme pour
       l'inscription — voir auth-password-login.js. */
    function submitPasswordLogin(email, password, btn, label){
      btn.disabled = true; btn.textContent = 'Verifying…';
      return fetch('/api/auth-password-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email, password: password }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Code sent to ' + email + '. Check your inbox (and spam).'); return true; }
          showErr((res.body && res.body.error) || 'Invalid email or password.');
          return false;
        })
        .catch(function(){ showErr('Network error. Please try again.'); return false; })
        .then(function(ok){ btn.disabled = false; btn.textContent = label; return ok; });
    }

    emailForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (emailInput.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showErr('Please enter a valid email.'); return; }
      var label = sendBtn.textContent;

      if (method === 'code') {
        requestCode(email).then(function(ok){ if (ok) toStep2(email, 'Enter your code'); });
        return;
      }

      /* method === 'password' — dans les deux cas, un mot de passe correct ne
         fait que déclencher l'envoi du code : l'étape 2 est toujours requise
         pour ouvrir la session. */
      var password = passwordInput.value || '';
      if (tab === 'signin') {
        if (!password) { showErr('Please enter your password.'); return; }
        submitPasswordLogin(email, password, sendBtn, label).then(function(ok){ if (ok) toStep2(email, 'Confirm it’s you'); });
      } else {
        if (password.length < 8) { showErr('Password must be at least 8 characters.'); return; }
        if (password !== (confirmInput.value || '')) { showErr('Passwords do not match.'); return; }
        requestPasswordRegister(email, password, sendBtn, label).then(function(ok){ if (ok) toStep2(email, 'Confirm your account'); });
      }
    });

    function submitCode(){
      if (verifying) return;                 /* une seule vérification à la fois */
      var code = getCode();
      if (!/^[0-9]{6}$/.test(code)) { showErr('Enter the 6-digit code.'); return; }
      verifying = true;
      verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying…';
      fetch('/api/auth-email-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: currentEmail, code: code }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Signed in! Redirecting…'); location.href = '/'; return; }
          showErr((res.body && res.body.error) || 'Invalid code.');
          otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); }); otp[0].focus();
          verifying = false; verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in';
        })
        .catch(function(){ showErr('Network error. Please try again.'); verifying = false; verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in'; });
    }
    codeForm.addEventListener('submit', function (e) { e.preventDefault(); submitCode(); });

    document.getElementById('clResend').addEventListener('click', function () {
      if (!currentEmail) return;
      requestCode(currentEmail, null, this, 'Resend code');
    });
    document.getElementById('clReset').addEventListener('click', function () {
      step2.style.display = 'none'; step1.style.display = 'block';
      otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); });
      errBox.classList.remove('show'); okBox.classList.remove('show');
      emailInput.focus();
    });
  })();
  </script>
</body>
</html>
