<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashShp — Sign in</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cl-bg:#000104; --cl-card:#06091a; --cl-card-line:rgba(255,255,255,.08);
      --cl-primary:#7257ff; --cl-primary-2:#6d4eff; --cl-primary-3:#5936e8; --cl-purple:#a855f7;
      --cl-red:#f87171; --cl-ink:#fff; --cl-dim:rgba(255,255,255,.5); --cl-faint:#9ba0b0;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--cl-bg);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

    .cl-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
    .cl-wrap::before{content:'';position:absolute;left:18%;top:12%;width:520px;height:520px;
      background:radial-gradient(circle, rgba(114,87,255,.14), transparent 68%);pointer-events:none;filter:blur(10px);}
    .cl-wrap::after{content:'';position:absolute;right:14%;bottom:8%;width:460px;height:460px;
      background:radial-gradient(circle, rgba(168,85,247,.12), transparent 68%);pointer-events:none;filter:blur(10px);}

    .cl-card{position:relative;width:100%;max-width:440px;background:var(--cl-card);border:1px solid var(--cl-card-line);
      border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;backdrop-filter:blur(12px);}
    .cl-glow{position:absolute;width:160px;height:160px;border-radius:50%;filter:blur(46px);pointer-events:none;}
    .cl-glow--a{top:-70px;left:-70px;background:rgba(114,87,255,.22);}
    .cl-glow--b{bottom:-70px;right:-70px;background:rgba(168,85,247,.16);}

    .cl-head{position:relative;z-index:1;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.012);padding:22px 24px;}
    .cl-close{position:absolute;top:16px;right:16px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
      border-radius:8px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .15s,background .15s;}
    .cl-close:hover{color:#fff;background:rgba(255,255,255,.08);}
    .cl-brand{display:flex;align-items:center;justify-content:center;gap:10px;}
    .cl-brand__badge{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,rgba(114,87,255,.28),rgba(114,87,255,.12));border:1.5px solid rgba(114,87,255,.55);color:#a99bff;}
    .cl-brand__name{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--cl-primary);}

    .cl-body{position:relative;z-index:1;padding:22px 24px 26px;}

    .cl-tabs{display:flex;gap:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:4px;margin-bottom:22px;}
    .cl-tab{flex:1;padding:9px 0;border-radius:8px;border:1px solid transparent;background:none;font-family:inherit;
      font-size:13.5px;font-weight:600;color:var(--cl-faint);cursor:pointer;transition:all .15s;}
    .cl-tab:hover{color:#fff;}
    .cl-tab.active{background:rgba(114,87,255,.15);border-color:rgba(114,87,255,.35);color:#fff;}

    .cl-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;margin-bottom:8px;}
    .cl-label svg{color:var(--cl-primary);flex-shrink:0;}
    .cl-label .req{color:var(--cl-red);}

    .cl-field{position:relative;margin-bottom:16px;}
    .cl-field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.32);pointer-events:none;}
    .cl-input{width:100%;height:46px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
      color:#fff;font-family:inherit;font-size:14.5px;padding:0 14px 0 40px;transition:border-color .15s,background .15s;}
    .cl-input:focus{outline:none;border-color:rgba(114,87,255,.6);background:rgba(255,255,255,.06);}
    .cl-input::placeholder{color:rgba(255,255,255,.28);}

    .cl-title{font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.3px;}
    .cl-sub{font-size:13px;color:var(--cl-dim);line-height:1.55;margin:0 0 20px;}
    .cl-sub b{color:#fff;font-weight:600;}

    .cl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:10px;
      font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;border:none;color:#fff;
      background:linear-gradient(to right,var(--cl-primary-3),var(--cl-primary-2));
      box-shadow:0 10px 26px rgba(114,87,255,.35);transition:transform .14s,box-shadow .2s,opacity .2s;}
    .cl-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(114,87,255,.45);}
    .cl-btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;}

    .cl-otp{display:flex;gap:8px;justify-content:center;margin:4px 0 20px;}
    .cl-otp input{width:44px;height:52px;border-radius:10px;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.1);
      color:#fff;font-family:'Space Grotesk',monospace;font-size:22px;font-weight:600;text-align:center;transition:border-color .12s,background .12s;}
    .cl-otp input:focus{outline:none;border-color:var(--cl-primary);background:rgba(114,87,255,.08);}
    .cl-otp input.filled{border-color:rgba(114,87,255,.5);}
    @media (max-width:380px){ .cl-otp input{width:38px;height:48px;font-size:19px;} }

    .cl-link{margin-top:14px;display:block;width:100%;text-align:center;background:none;border:none;color:var(--cl-faint);
      font-size:12.5px;cursor:pointer;font-family:inherit;}
    .cl-link:hover{color:#fff;}
    .cl-foot{margin-top:18px;font-size:12px;color:rgba(255,255,255,.32);text-align:center;line-height:1.6;}
    .cl-foot b{color:var(--cl-primary);font-weight:600;}

    .cl-msg{margin-bottom:16px;font-size:12.5px;padding:10px 13px;border-radius:9px;display:none;text-align:center;}
    .cl-msg.show{display:block;}
    .cl-msg--err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);color:#fda4a4;}
    .cl-msg--ok{background:rgba(114,87,255,.08);border:1px solid rgba(114,87,255,.25);color:#cabfff;}
  </style>
</head>
<body>
  <div class="cl-wrap">
    <div class="cl-card">
      <div class="cl-glow cl-glow--a"></div>
      <div class="cl-glow cl-glow--b"></div>

      <div class="cl-head">
        <a class="cl-close" href="/" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </a>
        <div class="cl-brand">
          <span class="cl-brand__badge">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          </span>
          <span class="cl-brand__name">FlashShp</span>
        </div>
      </div>

      <div class="cl-body">
        <div class="cl-msg cl-msg--err" id="clErr"></div>
        <div class="cl-msg cl-msg--ok" id="clOk">You have been signed out.</div>

        <!-- Step 1 : choose method -->
        <div id="clStep1">
          <div class="cl-tabs" role="tablist">
            <button type="button" class="cl-tab active" id="clTabSignIn" role="tab" aria-selected="true">Sign In</button>
            <button type="button" class="cl-tab" id="clTabRegister" role="tab" aria-selected="false">Register</button>
          </div>

          <div class="cl-title" id="clStepTitle">Welcome back</div>
          <div class="cl-sub" id="clStepSub">Enter your email and we'll send you a one-time code to continue.</div>

          <form id="clEmailForm" autocomplete="on">
            <label class="cl-label" for="clEmail">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              Email <span class="req">*</span>
            </label>
            <div class="cl-field">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input class="cl-input" type="email" id="clEmail" placeholder="your@email.com" required autocomplete="email" />
            </div>
            <button class="cl-btn" type="submit" id="clSendBtn">Send me a code</button>
          </form>

          <div class="cl-foot">No password to remember — <b>just your inbox</b>.</div>
        </div>

        <!-- Step 2 : verify code -->
        <div id="clStep2" style="display:none;">
          <div class="cl-title">Enter your code</div>
          <div class="cl-sub">We sent a 6-digit code to <b id="clVMail"></b></div>

          <form id="clCodeForm" autocomplete="off">
            <div class="cl-otp" id="clOtp">
              <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
            </div>
            <button class="cl-btn" type="submit" id="clVerifyBtn">Verify &amp; sign in</button>
            <button class="cl-link" type="button" id="clResend">Resend code</button>
            <button class="cl-link" type="button" id="clReset" style="margin-top:2px;">← Use a different email</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var ERRORS = {
      server: "Something went wrong. Please try again later."
    };
    var errBox = document.getElementById('clErr');
    var okBox = document.getElementById('clOk');
    var step1 = document.getElementById('clStep1');
    var step2 = document.getElementById('clStep2');
    var emailForm = document.getElementById('clEmailForm');
    var codeForm = document.getElementById('clCodeForm');
    var emailInput = document.getElementById('clEmail');
    var sendBtn = document.getElementById('clSendBtn');
    var verifyBtn = document.getElementById('clVerifyBtn');
    var otp = Array.prototype.slice.call(document.querySelectorAll('#clOtp input'));
    var currentEmail = '';
    var verifying = false;   /* garde anti-double-envoi (évite un "Network error" fantôme) */

    if (params.get('error')) { errBox.textContent = ERRORS[params.get('error')] || ('Sign-in error (' + params.get('error') + ').'); errBox.classList.add('show'); }
    if (params.get('loggedout')) okBox.classList.add('show');

    function showErr(m){ okBox.classList.remove('show'); errBox.textContent=m; errBox.classList.add('show'); }
    function showOk(m){ errBox.classList.remove('show'); okBox.textContent=m; okBox.classList.add('show'); }

    /* ── Sign In / Register : deux entrées cosmétiques vers le même flux email
       + code (un compte est créé au premier code vérifié — pas de mot de
       passe à gérer), comme le lien "Create Account" du menu le fait déjà. ── */
    var tabSignIn = document.getElementById('clTabSignIn');
    var tabRegister = document.getElementById('clTabRegister');
    var stepTitle = document.getElementById('clStepTitle');
    var stepSub = document.getElementById('clStepSub');
    function setTab(mode) {
      var isRegister = mode === 'register';
      tabSignIn.classList.toggle('active', !isRegister);
      tabRegister.classList.toggle('active', isRegister);
      tabSignIn.setAttribute('aria-selected', String(!isRegister));
      tabRegister.setAttribute('aria-selected', String(isRegister));
      stepTitle.textContent = isRegister ? 'Create your account' : 'Welcome back';
      stepSub.textContent = isRegister
        ? "Enter your email and we'll send you a code to set up your account."
        : "Enter your email and we'll send you a one-time code to continue.";
    }
    tabSignIn.addEventListener('click', function () { setTab('signin'); });
    tabRegister.addEventListener('click', function () { setTab('register'); });

    /* ── OTP boxes behaviour ── */
    function getCode(){ return otp.map(function(i){ return i.value; }).join(''); }
    otp.forEach(function (box, idx) {
      box.addEventListener('input', function () {
        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
        box.classList.toggle('filled', !!box.value);
        if (box.value && idx < 5) otp[idx + 1].focus();
        if (getCode().length === 6) codeForm.requestSubmit ? codeForm.requestSubmit() : submitCode();
      });
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !box.value && idx > 0) { otp[idx - 1].focus(); otp[idx - 1].value = ''; otp[idx - 1].classList.remove('filled'); e.preventDefault(); }
        if (e.key === 'ArrowLeft' && idx > 0) otp[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < 5) otp[idx + 1].focus();
      });
      box.addEventListener('paste', function (e) {
        e.preventDefault();
        var digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6).split('');
        otp.forEach(function (b, i) { b.value = digits[i] || ''; b.classList.toggle('filled', !!b.value); });
        (otp[Math.min(digits.length, 5)] || otp[5]).focus();
        if (digits.length === 6) submitCode();
      });
    });

    function toStep2(email){
      currentEmail = email;
      document.getElementById('clVMail').textContent = email;
      /* Step 2 explique déjà « We sent a code to… » : pas de bandeau redondant. */
      okBox.classList.remove('show'); errBox.classList.remove('show');
      step1.style.display = 'none';
      step2.style.display = 'block';
      setTimeout(function(){ otp[0].focus(); }, 60);
    }

    function requestCode(email, btn, label){
      btn.disabled = true; btn.textContent = 'Sending…';
      return fetch('/api/auth-email-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Code sent to ' + email + '. Check your inbox (and spam).'); return true; }
          if (res.status === 429) showErr((res.body && res.body.error) || 'Too many requests. Try again in a minute.');
          else if (res.status === 501) showErr('Email sign-in is temporarily unavailable. Please try again later.');
          else showErr((res.body && res.body.error) || 'Could not send the code. Try again.');
          return false;
        })
        .catch(function(){ showErr('Network error. Please try again.'); return false; })
        .then(function(ok){ btn.disabled = false; btn.textContent = label; return ok; });
    }

    emailForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (emailInput.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showErr('Please enter a valid email.'); return; }
      requestCode(email, sendBtn, 'Send me a code').then(function(ok){ if (ok) toStep2(email); });
    });

    function submitCode(){
      if (verifying) return;                 /* une seule vérification à la fois */
      var code = getCode();
      if (!/^[0-9]{6}$/.test(code)) { showErr('Enter the 6-digit code.'); return; }
      verifying = true;
      verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying…';
      fetch('/api/auth-email-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: currentEmail, code: code }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Signed in! Redirecting…'); location.href = '/'; return; }
          showErr((res.body && res.body.error) || 'Invalid code.');
          otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); }); otp[0].focus();
          verifying = false; verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in';
        })
        .catch(function(){ showErr('Network error. Please try again.'); verifying = false; verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in'; });
    }
    codeForm.addEventListener('submit', function (e) { e.preventDefault(); submitCode(); });

    document.getElementById('clResend').addEventListener('click', function () {
      if (!currentEmail) return;
      requestCode(currentEmail, this, 'Resend code');
    });
    document.getElementById('clReset').addEventListener('click', function () {
      step2.style.display = 'none'; step1.style.display = 'block';
      otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); });
      errBox.classList.remove('show'); okBox.classList.remove('show');
      emailInput.focus();
    });
  })();
  </script>
</body>
</html>
