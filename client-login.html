<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashShp — Sign in</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#08080a; --bd:rgba(255,255,255,.1); --bd2:rgba(255,255,255,.2); --mut:rgba(255,255,255,.5); }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

    /* Fond : la boutique en direct, floutée derrière la carte de connexion. */
    .cl-bg{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;z-index:0;
      filter:blur(16px) brightness(.45) saturate(1.1);transform:scale(1.1);opacity:.9;}
    .cl-bg-tint{position:fixed;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(ellipse at 50% 30%, rgba(8,8,10,.35), rgba(6,6,9,.72) 70%);}

    .cl-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;z-index:2;}
    .cl-wrap::before{content:'';position:absolute;left:50%;top:-12%;width:820px;height:480px;transform:translateX(-50%);
      background:radial-gradient(ellipse at center, rgba(255,255,255,.06), transparent 62%);pointer-events:none;}
    .cl-card{position:relative;width:100%;max-width:410px;background:rgba(255,255,255,.02);border:1px solid var(--bd);
      border-radius:22px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.5);}
    .cl-logo{font-size:23px;font-weight:800;letter-spacing:-.5px;text-align:center;}
    .cl-logo span{background:linear-gradient(135deg,#8a909c,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .cl-title{font-family:'Space Grotesk',Inter,sans-serif;font-size:21px;font-weight:600;text-align:center;margin:16px 0 6px;letter-spacing:-.3px;}
    .cl-sub{font-size:13.5px;color:var(--mut);line-height:1.6;text-align:center;margin-bottom:24px;}
    .cl-sub b{color:#fff;font-weight:600;}

    .cl-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:13px;
      font-family:Inter,sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid transparent;
      background:linear-gradient(135deg,#5b616e,#f6f7f9);color:#15161a;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .14s,box-shadow .2s,opacity .2s;}
    .cl-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.45);}
    .cl-btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;}

    .cl-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,.3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;}
    .cl-divider::before,.cl-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.09);}
    .cl-input{width:100%;height:48px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--bd);
      color:#fff;font-family:inherit;font-size:15px;padding:0 15px;margin-bottom:12px;text-align:center;}
    .cl-input:focus{outline:none;border-color:var(--bd2);background:rgba(255,255,255,.06);}

    /* OTP boxes */
    .cl-otp{display:flex;gap:9px;justify-content:center;margin:6px 0 20px;}
    .cl-otp input{width:46px;height:56px;border-radius:13px;background:rgba(255,255,255,.03);border:1.5px solid var(--bd);
      color:#fff;font-family:'Space Grotesk',monospace;font-size:24px;font-weight:600;text-align:center;transition:border-color .12s,background .12s;}
    .cl-otp input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.07);}
    .cl-otp input.filled{border-color:var(--bd2);}
    @media (max-width:380px){ .cl-otp input{width:40px;height:50px;font-size:21px;} }

    .cl-link{margin-top:16px;display:block;width:100%;text-align:center;background:none;border:none;color:var(--mut);
      font-size:13px;cursor:pointer;font-family:inherit;}
    .cl-link:hover{color:#fff;}
    .cl-back{margin-top:22px;display:block;text-align:center;font-size:12.5px;color:rgba(255,255,255,.38);}
    .cl-back:hover{color:#fff;}
    .cl-note{margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.32);text-align:center;line-height:1.6;}

    .cl-msg{margin-bottom:18px;font-size:13px;padding:11px 14px;border-radius:11px;display:none;text-align:center;}
    .cl-msg.show{display:block;}
    .cl-msg--err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);color:#fda4a4;}
    .cl-msg--ok{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.72);}
  </style>
</head>
<body>
  <iframe class="cl-bg" src="/" tabindex="-1" aria-hidden="true" scrolling="no" loading="eager"></iframe>
  <div class="cl-bg-tint"></div>
  <div class="cl-wrap">
    <div class="cl-card">
      <div class="cl-logo">Flash<span>Shp</span></div>

      <div class="cl-msg cl-msg--err" id="clErr"></div>
      <div class="cl-msg cl-msg--ok" id="clOk">You have been signed out.</div>

      <!-- Step 1 : choose method -->
      <div id="clStep1">
        <div class="cl-title">Sign in to your account</div>
        <div class="cl-sub">Access your orders and delivery history.</div>

        <form id="clEmailForm" autocomplete="on">
          <input class="cl-input" type="email" id="clEmail" placeholder="you@email.com" required autocomplete="email" />
          <button class="cl-btn" type="submit" id="clSendBtn">Send me a code</button>
        </form>
        <div class="cl-note">No password needed. We only use your email to find your orders.</div>
      </div>

      <!-- Step 2 : verify code -->
      <div id="clStep2" style="display:none;">
        <div class="cl-title">Enter your code</div>
        <div class="cl-sub">We sent a 6-digit code to <b id="clVMail"></b></div>

        <form id="clCodeForm" autocomplete="off">
          <div class="cl-otp" id="clOtp">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
            <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
          </div>
          <button class="cl-btn" type="submit" id="clVerifyBtn">Verify &amp; sign in</button>
          <button class="cl-link" type="button" id="clResend">Resend code</button>
          <button class="cl-link" type="button" id="clReset" style="margin-top:4px;">← Use a different email</button>
        </form>
      </div>

      <a class="cl-back" href="/">← Back to store</a>
    </div>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var ERRORS = {
      server: "Something went wrong. Please try again later."
    };
    var errBox = document.getElementById('clErr');
    var okBox = document.getElementById('clOk');
    var step1 = document.getElementById('clStep1');
    var step2 = document.getElementById('clStep2');
    var emailForm = document.getElementById('clEmailForm');
    var codeForm = document.getElementById('clCodeForm');
    var emailInput = document.getElementById('clEmail');
    var sendBtn = document.getElementById('clSendBtn');
    var verifyBtn = document.getElementById('clVerifyBtn');
    var otp = Array.prototype.slice.call(document.querySelectorAll('#clOtp input'));
    var currentEmail = '';

    if (params.get('error')) { errBox.textContent = ERRORS[params.get('error')] || ('Sign-in error (' + params.get('error') + ').'); errBox.classList.add('show'); }
    if (params.get('loggedout')) okBox.classList.add('show');

    function showErr(m){ okBox.classList.remove('show'); errBox.textContent=m; errBox.classList.add('show'); }
    function showOk(m){ errBox.classList.remove('show'); okBox.textContent=m; okBox.classList.add('show'); }

    /* ── OTP boxes behaviour ── */
    function getCode(){ return otp.map(function(i){ return i.value; }).join(''); }
    otp.forEach(function (box, idx) {
      box.addEventListener('input', function () {
        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
        box.classList.toggle('filled', !!box.value);
        if (box.value && idx < 5) otp[idx + 1].focus();
        if (getCode().length === 6) codeForm.requestSubmit ? codeForm.requestSubmit() : submitCode();
      });
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !box.value && idx > 0) { otp[idx - 1].focus(); otp[idx - 1].value = ''; otp[idx - 1].classList.remove('filled'); e.preventDefault(); }
        if (e.key === 'ArrowLeft' && idx > 0) otp[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < 5) otp[idx + 1].focus();
      });
      box.addEventListener('paste', function (e) {
        e.preventDefault();
        var digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6).split('');
        otp.forEach(function (b, i) { b.value = digits[i] || ''; b.classList.toggle('filled', !!b.value); });
        (otp[Math.min(digits.length, 5)] || otp[5]).focus();
        if (digits.length === 6) submitCode();
      });
    });

    function toStep2(email){
      currentEmail = email;
      document.getElementById('clVMail').textContent = email;
      /* Step 2 explique déjà « We sent a code to… » : pas de bandeau redondant. */
      okBox.classList.remove('show'); errBox.classList.remove('show');
      step1.style.display = 'none';
      step2.style.display = 'block';
      setTimeout(function(){ otp[0].focus(); }, 60);
    }

    function requestCode(email, btn, label){
      btn.disabled = true; btn.textContent = 'Sending…';
      return fetch('/api/auth-email-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Code sent to ' + email + '. Check your inbox (and spam).'); return true; }
          if (res.status === 429) showErr((res.body && res.body.error) || 'Too many requests. Try again in a minute.');
          else if (res.status === 501) showErr('Email sign-in is temporarily unavailable. Please try again later.');
          else showErr((res.body && res.body.error) || 'Could not send the code. Try again.');
          return false;
        })
        .catch(function(){ showErr('Network error. Please try again.'); return false; })
        .then(function(ok){ btn.disabled = false; btn.textContent = label; return ok; });
    }

    emailForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (emailInput.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showErr('Please enter a valid email.'); return; }
      requestCode(email, sendBtn, 'Send me a code').then(function(ok){ if (ok) toStep2(email); });
    });

    function submitCode(){
      var code = getCode();
      if (!/^[0-9]{6}$/.test(code)) { showErr('Enter the 6-digit code.'); return; }
      verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying…';
      fetch('/api/auth-email-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: currentEmail, code: code }) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; }); })
        .then(function(res){
          if (res.ok && res.body && res.body.ok) { showOk('Signed in! Redirecting…'); location.href = '/'; return; }
          showErr((res.body && res.body.error) || 'Invalid code.');
          otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); }); otp[0].focus();
          verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in';
        })
        .catch(function(){ showErr('Network error. Please try again.'); verifyBtn.disabled = false; verifyBtn.textContent = 'Verify & sign in'; });
    }
    codeForm.addEventListener('submit', function (e) { e.preventDefault(); submitCode(); });

    document.getElementById('clResend').addEventListener('click', function () {
      if (!currentEmail) return;
      requestCode(currentEmail, this, 'Resend code');
    });
    document.getElementById('clReset').addEventListener('click', function () {
      step2.style.display = 'none'; step1.style.display = 'block';
      otp.forEach(function(b){ b.value=''; b.classList.remove('filled'); });
      errBox.classList.remove('show'); okBox.classList.remove('show');
      emailInput.focus();
    });
  })();
  </script>
</body>
</html>
